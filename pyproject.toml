[project]
name = "vetra-ai-service"
version = "0.1.0"
description = "Vetra AI — Python microservice: public booking agent + business copilot (see docs/VETRA_AI_ARCHITECTURE.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.145",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
